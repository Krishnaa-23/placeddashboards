                        <span className="px-2.5 py-0.5 rounded-full bg-white/20 text-white font-black text-[10px] uppercase tracking-wider">Automated Risk Warning System</span>
                        <h2 className="text-[24px] font-black mt-1">Low-Performer Remediation System</h2>
                        <p className="text-xs text-amber-50 mt-1 max-w-xl">Automatically highlights students scoring below 50% readiness score. Enroll them into the 14-Day Placement Recovery Bootcamp.</p>
                      </div>
                    </div>
                    <button onClick={handleBatchEnrollBootcamp} className="px-5 py-3 bg-white text-[#052742] hover:bg-slate-100 font-black text-xs rounded-lg shadow-md shrink-0">
                      Batch Enroll All ({lowPerformers.length})
                    </button>
                  </div>

                  <div className="bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl border border-[#0F172A]/[0.08] shadow-[0_6px_20px_rgba(15,23,42,0.05)] space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-[24px] font-black text-[#052742]">At-Risk Student Queue</h3>
                        <p className="text-xs text-slate-500">Trigger: Readiness Score &lt; 50%</p>
                      </div>
                      <span className="px-3 py-1 rounded-full bg-rose-100 text-rose-700 font-black text-xs border border-rose-200">{lowPerformers.length} Action Needed</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      {lowPerformers.map(s => (
                        <div key={s.id} className="bg-[#FCFCFD] border border-slate-200 p-5 rounded-xl space-y-4">
                          <div>
                            <h4 className="font-black text-[#052742] text-sm">{s.name}</h4>
                            <p className="text-xs text-slate-500">{s.rollNo} • {s.department}</p>
                          </div>

                          <div className="p-3 bg-white rounded-lg border border-slate-200 text-xs space-y-1">
                            <div className="flex justify-between font-bold">
                              <span className="text-slate-600">Readiness Score:</span>
                              <span className="text-rose-600 font-black">{s.readinessScore}% (Critically Low)</span>
                            </div>
                            <div className="flex justify-between text-[11px] text-slate-500">
                              <span>Mock Test: {s.mockScore}%</span>
                              <span>CGPA: {s.cgpa}</span>
                            </div>
                          </div>

                          <div>
                            <span className="text-[11px] font-bold text-slate-600 block mb-1">Weakness Areas:</span>
                            <div className="flex flex-wrap gap-1">
                              {s.weaknessAreas.map((w, idx) => (
                                <span key={idx} className="px-2.5 py-0.5 bg-slate-200 text-slate-800 font-bold text-[10px] rounded-md border border-slate-300">{w}</span>
                              ))}
                            </div>
                          </div>

                          {s.bootcampEnrolled ? (
                            <div className="py-2.5 bg-emerald-100 text-emerald-800 text-xs font-black rounded-lg text-center border border-emerald-200 flex items-center justify-center gap-2">
                              ✔ Enrolled in Bootcamp
                            </div>
                          ) : (
                            <button onClick={() => handleEnrollBootcamp(s.id)} className="w-full py-2.5 bg-[#00A79D] hover:bg-[#00D2C4] text-white font-black text-xs rounded-lg">
                              Enroll in Bootcamp
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 5: REPORTS AUDIT */}
              {activeTab === 'reports' && (
                <div className="space-y-8">
                  <div className="bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl border border-[#0F172A]/[0.08] shadow-[0_6px_20px_rgba(15,23,42,0.05)] flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-[24px] font-black text-[#052742]">Downloadable Executive Reports & Export Audits</h2>
                      <p className="text-xs sm:text-sm text-slate-500 mt-1">Automated & 1-click executive compliance reports formatted for College Deans & Placement Directors.</p>
                    </div>
                    <button onClick={() => setIsPdfModalOpen(true)} className="px-5 py-3 rounded-lg bg-[#052742] hover:bg-[#00A79D] text-white font-black text-xs flex items-center gap-2 shadow-xs shrink-0">
                      <Icons.FileText /> Preview Dean PDF Report
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl border border-[#0F172A]/[0.08] shadow-[0_6px_20px_rgba(15,23,42,0.05)] hover:shadow-[0_12px_28px_rgba(15,23,42,0.08)] transition-all space-y-4">
                      <div className="w-12 h-12 rounded-xl bg-[#00A79D]/10 text-[#00A79D] flex items-center justify-center">
                        <Icons.FileText />
                      </div>
                      <div>
                        <h3 className="font-extrabold text-[#052742] text-base">Executive Dean & Director Report (PDF)</h3>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">1-click clean PDF report formatted for college deans and directors with campus readiness benchmarks.</p>
                      </div>
                      <button onClick={() => setIsPdfModalOpen(true)} className="w-full py-2.5 bg-[#052742] text-white hover:bg-[#00A79D] font-black text-xs rounded-lg flex items-center justify-center gap-2">
                        <Icons.Printer /> Download / Print PDF Report
                      </button>
                    </div>

                    <div className="bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl border border-[#0F172A]/[0.08] shadow-[0_6px_20px_rgba(15,23,42,0.05)] hover:shadow-[0_12px_28px_rgba(15,23,42,0.08)] transition-all space-y-4">
                      <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                        <Icons.FileText />
                      </div>
                      <div>
                        <h3 className="font-extrabold text-[#052742] text-base">Master Student Data Export (Excel / CSV)</h3>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">1-click raw CSV dataset including roll numbers, readiness scores, whitelist status, and drive applications.</p>
                      </div>
                      <button onClick={() => handleMockDownload('Master_Student_Placement_Data_2026.csv')} className="w-full py-2.5 bg-blue-600 text-white hover:bg-blue-700 font-black text-xs rounded-lg flex items-center justify-center gap-2">
                        <Icons.Download /> Download CSV File
                      </button>
                    </div>

                    <div className="bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl border border-[#0F172A]/[0.08] shadow-[0_6px_20px_rgba(15,23,42,0.05)] hover:shadow-[0_12px_28px_rgba(15,23,42,0.08)] transition-all space-y-4">
                      <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                        <Icons.AlertTriangle />
                      </div>
                      <div>
                        <h3 className="font-extrabold text-[#052742] text-base">Low-Performer Remediation Audit</h3>
                        <p className="text-xs text-slate-500 mt-1 leading-relaxed">Detailed audit report of low-performing students and 14-day bootcamp recovery progress.</p>
                      </div>
                      <button onClick={() => handleMockDownload('Low_Performer_Remediation_Audit_2026.pdf')} className="w-full py-2.5 bg-amber-600 text-white hover:bg-amber-700 font-black text-xs rounded-lg flex items-center justify-center gap-2">
                        <Icons.Download /> Download Audit PDF
                      </button>
                    </div>
                  </div>

                  {/* RECENT DOWNLOADS TABLE */}
                  <div className="bg-white/95 backdrop-blur-md p-6 sm:p-7 rounded-2xl border border-[#0F172A]/[0.08] shadow-[0_6px_20px_rgba(15,23,42,0.05)] space-y-4">
                    <h3 className="font-black text-[24px] text-[#052742]">Recent Export & Download Audit History</h3>
                    <div className="overflow-x-auto rounded-xl border border-[#0F172A]/[0.08]">
                      <table className="w-full text-left text-xs text-slate-600 min-w-[640px]">
                        <thead className="bg-[#FAFBFC] text-slate-600 uppercase text-[10px] font-black tracking-wider border-b border-[#0F172A]/[0.08]">
                          <tr>
                            <th className="py-4 px-5">Report Document Name</th>
                            <th className="py-4 px-5">Format</th>
                            <th className="py-4 px-5">Generated Timestamp</th>
                            <th className="py-4 px-5">Generated By</th>
                            <th className="py-4 px-5">File Size</th>
                            <th className="py-4 px-5 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {recentReportsList.map((item, idx) => (
                            <tr key={idx} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-[#FAFBFC]'} hover:bg-slate-100/80 transition-colors`}>
                              <td className="py-4 px-5 font-black text-[#052742]">{item.name}</td>
                              <td className="py-4 px-5"><span className="px-2 py-0.5 rounded text-[10px] font-black bg-rose-100 text-rose-800">{item.format}</span></td>
                              <td className="py-4 px-5 font-mono text-[11px]">{item.date}</td>
                              <td className="py-4 px-5 font-bold">{item.generatedBy}</td>
                              <td className="py-4 px-5">{item.size}</td>
                              <td className="py-4 px-5 text-right">
                                <button onClick={() => handleMockDownload(item.name)} className="px-3 py-1.5 bg-[#052742] text-white font-bold text-xs rounded-lg">
                                  Re-download
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODALS */}

          {/* CREATE DRIVE MODAL */}
          {isCreateDriveOpen && (
            <div className="fixed inset-0 z-50 bg-[#052742]/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl relative text-[#052742]">
                <button onClick={() => setIsCreateDriveOpen(false)} className="absolute top-4 right-4 text-slate-400 bg-slate-100 hover:bg-slate-200 rounded-full p-2 text-xs font-black">✕</button>
                <h3 className="text-xl font-black mb-4">Create New Company Drive</h3>
                <form onSubmit={handleCreateDriveSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="font-extrabold block mb-1">Company Drive Name</label>
                    <input type="text" required placeholder="e.g. TCS Hiring Drive 2026" value={newDrive.companyName} onChange={(e) => setNewDrive({ ...newDrive, companyName: e.target.value })} className="w-full p-2.5 rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#00A79D]" />
                  </div>
                  <div>
                    <label className="font-extrabold block mb-1">Role Title</label>
                    <input type="text" required placeholder="e.g. Software Developer" value={newDrive.roleTitle} onChange={(e) => setNewDrive({ ...newDrive, roleTitle: e.target.value })} className="w-full p-2.5 rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#00A79D]" />
                  </div>
                  <div>
                    <label className="font-extrabold block mb-1">Package (CTC)</label>
                    <input type="text" placeholder="e.g. ₹14.0 LPA" value={newDrive.ctc} onChange={(e) => setNewDrive({ ...newDrive, ctc: e.target.value })} className="w-full p-2.5 rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#00A79D]" />
                  </div>
                  <div>
                    <label className="font-extrabold block mb-1">Minimum Readiness Score Threshold ({newDrive.minReadinessScore}%)</label>
                    <input type="range" min="40" max="95" value={newDrive.minReadinessScore} onChange={(e) => setNewDrive({ ...newDrive, minReadinessScore: e.target.value })} className="w-full accent-[#00A79D]" />
                  </div>
                  <div className="pt-2 flex justify-end gap-3">
                    <button type="button" onClick={() => setIsCreateDriveOpen(false)} className="px-4 py-2.5 rounded-lg bg-slate-100 text-slate-700 font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-lg bg-[#00A79D] hover:bg-[#00D2C4] text-white font-black">Create & Invite Students</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PDF REPORT MODAL */}
          {isPdfModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#052742]/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-8 max-w-3xl w-full shadow-2xl relative text-[#052742]">
                <button onClick={() => setIsPdfModalOpen(false)} className="absolute top-4 right-4 text-slate-400 bg-slate-100 hover:bg-slate-200 rounded-full p-2 text-xs font-black">✕</button>
                <div className="border border-slate-300 p-8 rounded-xl bg-white space-y-6">
                  <div className="flex justify-between items-start border-b pb-4">
                    <div>
                      <h2 className="font-black text-2xl text-[#052742]">PLACED Executive Audit Report</h2>
                      <p className="text-xs text-slate-500 font-bold mt-1">St. Xavier's Institute of Technology • Batch 2026</p>
                    </div>
                    <span className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-black text-xs">Official Compliance Report</span>
                  </div>

                  <div className="grid grid-cols-4 gap-3 text-center text-xs">
                    <div className="p-3 bg-slate-50 rounded-lg border">
                      <span className="text-[10px] text-slate-400 block font-bold">Total Batch</span>
                      <span className="font-black text-lg">1,480</span>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-lg border">
                      <span className="text-[10px] text-slate-400 block font-bold">Passed Mocks</span>
                      <span className="font-black text-lg text-emerald-600">1,185</span>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-lg border">
                      <span className="text-[10px] text-slate-400 block font-bold">Interview Ready</span>
                      <span className="font-black text-lg text-[#00A79D]">842</span>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-lg border">
                      <span className="text-[10px] text-slate-400 block font-bold">Placed Students</span>
                      <span className="font-black text-lg text-blue-600">342</span>
                    </div>
                  </div>

                  <p className="text-xs text-slate-600 leading-relaxed">
                    This official audit report summarizes student placement readiness benchmarks, department conversion rates, and recruitment drive engagement for the 2026 batch. Formatted for Dean & Board review.
                  </p>

                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={() => setIsPdfModalOpen(false)} className="px-4 py-2.5 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs">Close</button>
                    <button onClick={() => { window.print(); showToast('Triggered PDF Print Dialog'); }} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-lg flex items-center gap-2">
                      <Icons.Printer /> Print / Export PDF
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* STUDENT PROFILE DRAWER */}
          {selectedStudent && (
            <div className="fixed inset-0 z-50 bg-[#052742]/70 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-white h-full p-8 shadow-2xl overflow-y-auto space-y-6">
                <div className="flex items-center justify-between border-b pb-4">
                  <h3 className="font-black text-lg text-[#052742]">Student Profile Details</h3>
                  <button onClick={() => setSelectedStudent(null)} className="text-slate-400 bg-slate-100 hover:bg-slate-200 p-2 rounded-full text-xs font-black">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="p-4 bg-[#FCFCFD] rounded-xl border border-[#0F172A]/[0.08]">
                    <span className="text-[10px] text-slate-400 uppercase font-black">Full Name</span>
                    <h4 className="font-black text-lg text-[#052742] mt-0.5">{selectedStudent.name}</h4>
                    <p className="text-slate-500 font-mono mt-1">{selectedStudent.rollNo}</p>
                    <p className="text-slate-500">{selectedStudent.email}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-center">
                    <div className="p-3 bg-slate-50 rounded-xl border">
                      <span className="text-[10px] text-slate-400 font-bold block">Department</span>
                      <span className="font-extrabold text-[#052742]">{selectedStudent.department}</span>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-xl border">
                      <span className="text-[10px] text-slate-400 font-bold block">CGPA</span>
                      <span className="font-extrabold text-[#052742]">{selectedStudent.cgpa}</span>
                    </div>
                  </div>

                  <div className="p-4 bg-[#00A79D]/10 rounded-xl border border-[#00A79D]/30 space-y-2">
                    <span className="text-[10px] text-[#00A79D] font-black uppercase">Readiness Score Benchmark</span>
                    <div className="flex items-baseline justify-between">
                      <span className="text-2xl font-black text-[#052742]">{selectedStudent.readinessScore}%</span>
                      <span className="text-xs font-bold text-[#00A79D]">{selectedStudent.readinessStatus}</span>
                    </div>
                  </div>

                  {selectedStudent.readinessScore < 50 && (
                    <div className="p-4 bg-rose-50 rounded-xl border border-rose-200 space-y-3">
                      <span className="text-xs font-black text-rose-700 block">At-Risk Student Actions</span>
                      {selectedStudent.bootcampEnrolled ? (
                        <div className="p-2.5 bg-emerald-100 text-emerald-800 font-bold rounded-lg text-center">
                          ✔ Enrolled in Placement Bootcamp
                        </div>
                      ) : (
                        <button onClick={() => { handleEnrollBootcamp(selectedStudent.id); setSelectedStudent(null); }} className="w-full py-2.5 bg-[#00A79D] text-white font-black rounded-lg">
                          Enroll in 14-Day Recovery Bootcamp
                        </button>
                      )}
                    </div>
                  )}

                  <button onClick={() => setSelectedStudent(null)} className="w-full py-3 bg-[#052742] text-[#fff] font-bold rounded-lg text-xs mt-4">
                    Close Drawer
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
